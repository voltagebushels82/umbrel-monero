name: Tests and production build
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ui
      - run: npm test
      - run: npm run build:ui
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm audit --omit=dev
      - run: npm audit --prefix ui --omit=dev
      - run: docker build -t monero-test .
